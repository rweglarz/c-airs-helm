apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "subnetinfos.paloaltonetworks.com"
spec:
  group: "paloaltonetworks.com"
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          required: ["spec"]
          type: object
          properties:
            spec:
              required: ["subnetinfo"]
              type: object
              properties:
                subnetinfo:
                  type: string
                  minimum: 1
  scope: "Namespaced"
  names:
    plural: "subnetinfos"
    singular: "subnetinfo"
    kind: "SubnetInfo"

